version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# DTSEN Stack
#  dtsen_api      : Flask/Gunicorn backend  (internal, tidak dibuka ke host)
#  dtsen_frontend : Vue build + Nginx        (port 5173, ganti systemctl)
#
# Nginx di dalam container mem-proxy /api/* → dtsen_api:5000 (no CORS)
#
# Cara deploy (pertama kali):
#   cp backend/.env.example backend/.env
#   nano backend/.env                    # isi DATABASE_URL, SECRET_KEY, dll
#   systemctl stop dtsen-frontend        # matikan service lama
#   systemctl disable dtsen-frontend     # cegah nyala otomatis
#   docker compose up -d --build
#
# Update selanjutnya:
#   git pull
#   docker compose up -d --build --no-deps frontend
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dtsen_api:latest
    container_name: dtsen_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FLASK_APP: wsgi.py
      FLASK_ENV: production
    volumes:
      - dtsen_uploads:/app/uploads
    expose:
      - "5000"          # hanya internal network, tidak ke host
    networks:
      - dtsen_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Vue build + Nginx proxy) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1    # nginx proxy /api/* → dtsen_api:5000
    image: dtsen_frontend:latest
    container_name: dtsen_frontend
    restart: unless-stopped
    ports:
      - "5173:80"       # host:5173 → container nginx:80 (sama dengan port systemctl lama)
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dtsen_net

volumes:
  dtsen_uploads:

networks:
  dtsen_net:
    driver: bridge
